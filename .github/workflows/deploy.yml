name: Daily Update & Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 선택 (full: 데이터수집+글생성+배포, deploy_only: 현재 main 기반 배포만)'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - deploy_only
      festival_versus_force:
        description: 'festival-versus 강제 실행 여부 (true면 요일/연휴 조건 무시)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      festival_versus_mode:
        description: 'festival-versus 강제 실행 모드 (holiday=연휴형, weekend=주말형)'
        required: false
        default: 'holiday'
        type: choice
        options:
          - holiday
          - weekend

permissions:
  contents: write

concurrency:
  group: daily-update-deploy-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  update-and-deploy:
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: '[공통] 리포트 실행 컨텍스트 초기화 (full 모드)'
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        run: |
          echo "RUN_STARTED_AT_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "REPORT_DATE_KST=$(TZ=Asia/Seoul date +'%Y-%m-%d')" >> "$GITHUB_ENV"
          mkdir -p runs/daily

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: '[사전차단] 맛집 이미지 참조 무결성 검사'
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const dir = path.join(process.cwd(), 'src', 'content', 'life');
          const files = fs.readdirSync(dir).filter((f) => f.endsWith('.md'));
          const missHero = [];
          const missInline = [];

          for (const file of files) {
            const fullPath = path.join(dir, file);
            const text = fs.readFileSync(fullPath, 'utf8');

            const heroMatch = text.match(/^image:\s*"([^"]+)"/m);
            const hero = heroMatch ? heroMatch[1].trim() : '';
            if (hero.startsWith('/images/restaurants/')) {
              const diskPath = path.join(process.cwd(), 'public', hero.slice(1));
              if (!fs.existsSync(diskPath)) {
                missHero.push({ file, ref: hero });
              }
            }

            const inlineRegex = /!\[[^\]]*\]\((\/images\/restaurants\/[^)]+)\)/g;
            let match;
            while ((match = inlineRegex.exec(text)) !== null) {
              const ref = match[1];
              const diskPath = path.join(process.cwd(), 'public', ref.slice(1));
              if (!fs.existsSync(diskPath)) {
                missInline.push({ file, ref });
              }
            }
          }

          console.log(`[image-guard] missHero=${missHero.length}, missInline=${missInline.length}`);

          if (missHero.length > 0) {
            console.error('[image-guard] Missing hero assets:');
            for (const item of missHero) {
              console.error(` - ${item.file} :: ${item.ref}`);
            }
          }

          if (missInline.length > 0) {
            console.error('[image-guard] Missing inline assets:');
            for (const item of missInline) {
              console.error(` - ${item.file} :: ${item.ref}`);
            }
          }

          if (missHero.length > 0 || missInline.length > 0) {
            console.warn('[image-guard] WARN: 누락 참조가 있지만 자동화는 계속 진행합니다.');
          } else {
            console.log('[image-guard] PASS: local restaurant image references are valid.');
          }
          NODE

      - name: '[1단계] 인천 지역 정보 수집'
        id: collect_incheon
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        run: node scripts/collect-incheon.js
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-3.1-flash-lite'
          DESCRIPTION_MARKDOWN_BATCH_LIMIT: '5'
          DESCRIPTION_MARKDOWN_DELAY_MS: '15000'
          DESCRIPTION_MARKDOWN_RETRY_COUNT: '4'
          DESCRIPTION_MARKDOWN_RETRY_DELAY_MS: '20000'

      - name: '[1단계] 전국 보조금·복지 정책 수집'
        id: collect_subsidy
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        run: node scripts/collect-subsidy.js
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-3.1-flash-lite'
          DESCRIPTION_MARKDOWN_BATCH_LIMIT: '5'
          DESCRIPTION_MARKDOWN_MIN_BATCH_LIMIT: '1'
          DESCRIPTION_MARKDOWN_DELAY_MS: '15000'
          DESCRIPTION_MARKDOWN_FAIL_THRESHOLD_PCT: '25'

      - name: '[1단계] API 부하 분산 대기'
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        run: |
          echo "apis.data.go.kr 호출 간격 확보를 위해 45초 대기"
          sleep 45

      - name: '[1단계] 전국 축제·여행 정보 수집'
        id: collect_festival
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        run: node scripts/collect-festival.js
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-3.1-flash-lite'
          DESCRIPTION_MARKDOWN_BATCH_LIMIT: '5'
          DESCRIPTION_MARKDOWN_DELAY_MS: '15000'
          DESCRIPTION_MARKDOWN_RETRY_COUNT: '4'
          DESCRIPTION_MARKDOWN_RETRY_DELAY_MS: '20000'

      - name: '[1단계] 만료 콘텐츠 처리'
        id: cleanup_expired
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        run: node scripts/cleanup-expired.js

      - name: '[1단계] non-Top 내부 링크 정리'
        id: cleanup_nontop_links
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        run: node scripts/cleanup-nontop-links.js

      - name: '[1단계] 변경사항 커밋 & 푸시 (공공데이터)'
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data src/content/posts scripts/cleanup-expired.js
          if ! git diff --cached --quiet; then
            git commit -m "자동 업데이트(1단계): 공공데이터 동기화 $(TZ=Asia/Seoul date +'%Y-%m-%d')"
            git push
          else
            echo "변경사항 없음"
          fi

      - name: '[1단계] Next.js 빌드'
        id: build_stage1
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        run: npm run build
        env:
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_ADSENSE_ID: 'ca-pub-5984189992308575'

      - name: '[1단계] Playwright 브라우저 설치'
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        run: npx playwright install --with-deps chromium

      - name: '[1단계] Playwright E2E 테스트 (배포 전)'
        id: e2e_stage1
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}

      - name: '[1단계] Cloudflare Pages 배포'
        id: deploy_stage1
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        run: |
          # RSC Flight payload(.txt) 제거. Cloudflare Pages 파일 수 한도(20,000) 대응.
          # .assetsignore 는 하위 디렉터리에 적용되지 않아 직접 삭제한다.
          # out/ 은 빌드 산출물이므로 삭제해도 소스에 영향이 없다.
          BEFORE=$(find out -type f | wc -l)
          find out -type f -name '__next._tree.txt' -delete
          find out -type f -name '__next._head.txt' -delete
          AFTER=$(find out -type f | wc -l)
          echo "RSC payload 제거: ${BEFORE} → ${AFTER}"
          # out/.assetsignore 로 제외되는 RSC payload는 업로드되지 않으므로 카운트에서도 뺀다.
          # 두 기준이 어긋나면 실제 업로드는 통과하는데 가드만 걸린다.
          FILE_COUNT=$(find out -type f \
            ! -name '__next._tree.txt' \
            ! -name '__next._head.txt' \
            | wc -l)
          echo "out 업로드 대상 파일 수: ${FILE_COUNT}"
          if [ "$FILE_COUNT" -gt 20000 ]; then
            echo "::error::Cloudflare Pages 파일 수 한도(20000) 초과: ${FILE_COUNT}개. 배포 중단."
            echo "deploy_url=" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$FILE_COUNT" -gt 16000 ]; then
            echo "::warning::Cloudflare Pages 파일 수가 한도의 80%를 넘었습니다: ${FILE_COUNT}/20000"
          fi
          DEPLOY_LOG=$(mktemp)
          BACKOFFS=(10 30 60)
          DEPLOY_OK=0
          for idx in 0 1 2; do
            ATTEMPT=$((idx + 1))
            : > "$DEPLOY_LOG"
            echo "Cloudflare deploy attempt ${ATTEMPT}/3"
            npx wrangler pages deploy out --project-name=my-local-info --branch=main --commit-hash="${GITHUB_SHA}" --commit-message="Automated deploy ${GITHUB_SHA}" 2>&1 | tee "$DEPLOY_LOG"
            DEPLOY_EXIT=${PIPESTATUS[0]}
            if [ "$DEPLOY_EXIT" -eq 0 ]; then
              DEPLOY_OK=1
              break
            fi

            if grep -Eiq 'malformed response|-> 521|-> 522|\b521\b|\b522\b' "$DEPLOY_LOG"; then
              if [ "$ATTEMPT" -lt 3 ]; then
                SLEEP_SECONDS=${BACKOFFS[$idx]}
                echo "Transient Cloudflare error detected (attempt ${ATTEMPT}/3). Retrying in ${SLEEP_SECONDS}s..."
                sleep "$SLEEP_SECONDS"
                continue
              fi
              echo "Transient Cloudflare error persisted after 3 attempts."
              exit "$DEPLOY_EXIT"
            fi

            echo "Non-retryable Cloudflare deploy error detected on attempt ${ATTEMPT}."
            exit "$DEPLOY_EXIT"
          done

          if [ "$DEPLOY_OK" -ne 1 ]; then
            echo "Cloudflare deploy failed after retries."
            exit 1
          fi

          DEPLOY_URL=$(grep -Eo 'https://[a-z0-9-]+\.my-local-info-2gs\.pages\.dev' "$DEPLOY_LOG" | tail -1 || true)
          echo "deploy_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: '[1단계] Cloudflare Cache Purge'
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        run: |
          PURGE_RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$PURGE_RESULT"
          echo "⚠️ Cache purge failed"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

      - name: '[2단계] 에디터 노트 업데이트 생성 (editor_note)'
        id: generate_editor_notes
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        continue-on-error: true
        run: node scripts/generate-editor-notes.js
        timeout-minutes: 20
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EDITOR_NOTES_BATCH_SIZE: '10'
          EDITOR_NOTES_DELAY_MS: '1000'

      - name: '[2단계] Anthropic 블로그 통합 Batch 생성'
        id: generate_anthropic_blog
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        run: node scripts/run-anthropic-blog-batch.js
        timeout-minutes: 360
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BLOG_MODEL: 'claude-sonnet-5'
          ANTHROPIC_DAILY_BUDGET_KRW: '1500'
          ANTHROPIC_BUDGET_WARN_RATIO: '0.8'
          ANTHROPIC_DISABLE_FINALIZE_SYNC_RETRY: 'false'
          ANTHROPIC_BATCH_POLL_INTERVAL_MS: '300000'
          ANTHROPIC_BATCH_TIMEOUT_MS: '21600000'
          CURATION_COUNT: '1'
          CURATION_TOP_N: '5'
          BLOG_MAX_GENERATION_SECONDS: '900'
          BLOG_MAX_CANDIDATES_PER_CATEGORY: '2'
          BLOG_MAX_API_CALLS: '6'
          BLOG_POSTS_INCHEON: '1'
          BLOG_POSTS_FESTIVAL: '1'
          BLOG_POSTS_SUBSIDY: '2'
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          FESTIVAL_VERSUS_ENABLE_FRIDAY: 'true'
          FESTIVAL_VERSUS_ENABLE_HOLIDAY_EVE: 'true'
          FESTIVAL_VERSUS_HOLIDAY_MIN_STREAK: '2'
          FESTIVAL_VERSUS_WEEKEND_COUNT: '2'
          FESTIVAL_VERSUS_HOLIDAY_COUNT: '3'
          FESTIVAL_VERSUS_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.festival_versus_force == 'true' && 'true' || 'false' }}
          FESTIVAL_VERSUS_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.festival_versus_mode || 'holiday' }}

      - name: '[2단계] Next.js 빌드'
        id: build_stage2
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        run: npm run build
        env:
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_ADSENSE_ID: 'ca-pub-5984189992308575'

      - name: '[2단계] Playwright E2E 테스트 (배포 전)'
        id: e2e_stage2
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}

      - name: '[2단계] Cloudflare Pages 배포'
        id: deploy_stage2
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        run: |
          # RSC Flight payload(.txt) 제거. Cloudflare Pages 파일 수 한도(20,000) 대응.
          # .assetsignore 는 하위 디렉터리에 적용되지 않아 직접 삭제한다.
          # out/ 은 빌드 산출물이므로 삭제해도 소스에 영향이 없다.
          BEFORE=$(find out -type f | wc -l)
          find out -type f -name '__next._tree.txt' -delete
          find out -type f -name '__next._head.txt' -delete
          AFTER=$(find out -type f | wc -l)
          echo "RSC payload 제거: ${BEFORE} → ${AFTER}"
          # out/.assetsignore 로 제외되는 RSC payload는 업로드되지 않으므로 카운트에서도 뺀다.
          # 두 기준이 어긋나면 실제 업로드는 통과하는데 가드만 걸린다.
          FILE_COUNT=$(find out -type f \
            ! -name '__next._tree.txt' \
            ! -name '__next._head.txt' \
            | wc -l)
          echo "out 업로드 대상 파일 수: ${FILE_COUNT}"
          if [ "$FILE_COUNT" -gt 20000 ]; then
            echo "::error::Cloudflare Pages 파일 수 한도(20000) 초과: ${FILE_COUNT}개. 배포 중단."
            echo "deploy_url=" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$FILE_COUNT" -gt 16000 ]; then
            echo "::warning::Cloudflare Pages 파일 수가 한도의 80%를 넘었습니다: ${FILE_COUNT}/20000"
          fi
          DEPLOY_LOG=$(mktemp)
          BACKOFFS=(10 30 60)
          DEPLOY_OK=0
          for idx in 0 1 2; do
            ATTEMPT=$((idx + 1))
            : > "$DEPLOY_LOG"
            echo "Cloudflare deploy attempt ${ATTEMPT}/3"
            npx wrangler pages deploy out --project-name=my-local-info --branch=main --commit-hash="${GITHUB_SHA}" --commit-message="Automated deploy ${GITHUB_SHA}" 2>&1 | tee "$DEPLOY_LOG"
            DEPLOY_EXIT=${PIPESTATUS[0]}
            if [ "$DEPLOY_EXIT" -eq 0 ]; then
              DEPLOY_OK=1
              break
            fi

            if grep -Eiq 'malformed response|-> 521|-> 522|\b521\b|\b522\b' "$DEPLOY_LOG"; then
              if [ "$ATTEMPT" -lt 3 ]; then
                SLEEP_SECONDS=${BACKOFFS[$idx]}
                echo "Transient Cloudflare error detected (attempt ${ATTEMPT}/3). Retrying in ${SLEEP_SECONDS}s..."
                sleep "$SLEEP_SECONDS"
                continue
              fi
              echo "Transient Cloudflare error persisted after 3 attempts."
              exit "$DEPLOY_EXIT"
            fi

            echo "Non-retryable Cloudflare deploy error detected on attempt ${ATTEMPT}."
            exit "$DEPLOY_EXIT"
          done

          if [ "$DEPLOY_OK" -ne 1 ]; then
            echo "Cloudflare deploy failed after retries."
            exit 1
          fi

          DEPLOY_URL=$(grep -Eo 'https://[a-z0-9-]+\.my-local-info-2gs\.pages\.dev' "$DEPLOY_LOG" | tail -1 || true)
          echo "deploy_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: '[2단계] Cloudflare Cache Purge'
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        run: |
          PURGE_RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$PURGE_RESULT"
          echo "⚠️ Cache purge failed"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

      - name: '[2단계] 변경사항 커밋 & 푸시 (블로그)'
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/posts
          if ! git diff --cached --quiet; then

            git commit -m "자동 업데이트(2단계): 블로그 4건 생성 $(TZ=Asia/Seoul date +'%Y-%m-%d')"
            git push
          else
            echo "변경사항 없음"
          fi

      - name: '[2.5단계] 픽앤조이 초이스 자동 생성'
        id: generate_choice
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        continue-on-error: true
        run: node scripts/generate-choice-posts-auto.js
        timeout-minutes: 20
        env:
          CHOICE_AUTO_ENABLED: 'true'
          CHOICE_MIN_REVIEW_COUNT: '50'
          CHOICE_PRODUCT_HISTORY_DAYS: '60'
          CHOICE_TARGET_POOL_SIZE: '120'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHOICE_GEMINI_MODEL: 'gemini-3.1-flash-lite'
          CHOICE_GEMINI_TIMEOUT_MS: '120000'
          CHOICE_GEMINI_MAX_OUTPUT_TOKENS: '8192'
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}

      - name: '[Gemini 보호] 2단계 종료 후 쿨다운'
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        run: sleep 60

      - name: '[2.5단계] 변경사항 커밋 & 푸시 (픽앤조이 초이스)'
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        continue-on-error: true
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/life scripts/data/recommended-products.json
          if ! git diff --cached --quiet; then

            git commit -m "자동 업데이트(2.5단계): 초이스 1건 생성 $(TZ=Asia/Seoul date +'%Y-%m-%d')"
            git push
          else
            echo "변경사항 없음"
          fi

      - name: '[3-step] Restaurant candidate collect/refresh'
